<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RDUMP_v0.7</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <div class="title">RDUMP</div>
      
      <!-- Theme selector -->
      <div class="theme-selector" style="margin-bottom: 15px;">
        <label>
          Theme:
          <select id="theme-select">
            <option value="cyberpunk">Cyberpunk</option>
            <option value="light-blue">Light Blue</option>
          </select>
        </label>
      </div>

      <div id="all_tabs"></div>

      <div class="input-wrap">
        <span class="corner-label">URL list</span>
        <div class="cyber-dropdown" id="separator-select" data-storage="separator">
          <div class="cyber-dd-selected" tabindex="0">
            <span class="cyber-dd-text">Newline separated</span>
            <span class="cyber-dd-arrow"></span>
          </div>
          <div class="cyber-dd-menu">
            <div class="cyber-dd-option" data-value="newline" data-text="Newline separated" data-prefix="URL list: ">Newline separated</div>
            <div class="cyber-dd-option" data-value="space" data-text="Space separated" data-prefix="URL list: ">Space separated</div>
          </div>
        </div>
      </div>

      <div class="input-wrap">
        <span class="corner-label">Output</span>
        <div class="cyber-dropdown" id="output-select" data-storage="outputMode">
          <div class="cyber-dd-selected" tabindex="0">
            <span class="cyber-dd-text">Save to File</span>
            <span class="cyber-dd-arrow"></span>
          </div>
          <div class="cyber-dd-menu">
            <div class="cyber-dd-option" data-value="file" data-text="Save to File" data-prefix="Output: ">Save to File</div>
            <div class="cyber-dd-option" data-value="clipboard" data-text="Copy to Clipboard" data-prefix="Output: ">Copy to Clipboard</div>
          </div>
        </div>
      </div>

      <div class="input-wrap">
        <span class="corner-label">Filename</span>
        <input id="file_name" type="text" value="rdump-tabs.txt" placeholder="REQUIRED IF SAVING TO FILE" required/>
      </div>
      <div id="btns">      
        <button id="dmp_btn">EXPORT SELECTED</button>
        <button id="dmp_all_btn">EXPORT ALL</button>
      </div>
      
      <div id="status-message" class="status-message"></div>

      <div class="divider">OR</div>
      <div class="import-label">IMPORT LIST OF URLs</div>
      <input type="file" id="fileInput">
    </div>
    <script src="popup.js"></script>
  </body>
</html>
