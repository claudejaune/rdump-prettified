<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RDUMP_v0.6</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <div class="title">RDUMP</div>
      
      <!-- Theme selector -->
      <div class="theme-selector" style="margin-bottom: 15px;">
        <label>
          Theme:
          <select id="theme-select">
            <option value="cyberpunk">Cyberpunk</option>
            <option value="light-blue">Light Blue</option>
          </select>
        </label>
      </div>

      <div id="all_tabs"></div>

      <!-- separator toggle -->
      <div class="option-toggle" id="separator-toggle">
        <span class="toggle-corner-label">Separator</span>
        <span class="option-opt active" data-value="newline">Newline</span>
        <span class="toggle-arrow"></span>
        <span class="option-opt inactive" data-value="space">Space</span>
        <input type="radio" name="separator" value="newline" checked style="display:none">
      </div>

      <!-- output mode toggle -->
      <div class="option-toggle" id="output-toggle">
        <span class="toggle-corner-label">URL List</span>
        <span class="option-opt active" data-value="file">Save</span>
        <span class="toggle-arrow"></span>
        <span class="option-opt inactive" data-value="clipboard">Copy</span>
        <input type="radio" name="output_mode" value="file" checked style="display:none">
      </div>

      <input id="file_name" type="text" value="rdump-tabs.txt" placeholder="DEST_FILENAME (REQUIRED IF SAVING TO FILE)" required/>
      <div id="btns">      
        <button id="dmp_btn">EXPORT SELECTED</button>
        <button id="dmp_all_btn">EXPORT ALL</button>
      </div>
      
      <div id="status-message" class="status-message"></div>

      <div class="divider">OR</div>
      <div class="import-label">IMPORT LIST OF URLs</div>
      <input type="file" id="fileInput">
    </div>
    <script src="popup.js"></script>
  </body>
</html>
