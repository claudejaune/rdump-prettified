<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Confirmation Test</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .status-message {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            min-height: 20px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .status-message.show {
            opacity: 1;
            max-height: 50px;
            margin-top: 10px;
        }
        .status-message.success {
            color: #00ff8c;
            background-color: rgba(0, 255, 140, 0.1);
            border: 1px solid #00ff8c;
        }
        .status-message.error {
            color: #ff5555;
            background-color: rgba(255, 85, 85, 0.1);
            border: 1px solid #ff5555;
        }
        .status-message.info {
            color: #00f0ff;
            background-color: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Clipboard Confirmation Test</h1>
        <p>Testing the status message functionality for clipboard operations.</p>
        
        <div class="test-buttons">
            <button id="test-success">Test Success Message</button>
            <button id="test-error">Test Error Message</button>
            <button id="test-info">Test Info Message</button>
        </div>
        
        <div id="test-status-message" class="status-message"></div>
        
        <div style="margin-top: 30px;">
            <h3>Test Clipboard Simulation</h3>
            <textarea id="test-text" rows="4" cols="50" placeholder="Enter text to copy to clipboard...">Test text for clipboard</textarea>
            <br>
            <button id="test-clipboard">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const testStatusMessage = document.getElementById('test-status-message');
        
        // Status message functionality (copied from popup.js)
        function showStatusMessage(message, type = 'info') {
            // Clear any existing timeout
            if (window.statusMessageTimeout) {
                clearTimeout(window.statusMessageTimeout);
            }
            
            // Set message and type
            testStatusMessage.textContent = message;
            testStatusMessage.className = 'status-message show ' + type;
            
            // Hide after 3 seconds
            window.statusMessageTimeout = setTimeout(() => {
                testStatusMessage.classList.remove('show');
                // Clear text after fade out
                setTimeout(() => {
                    testStatusMessage.textContent = '';
                    testStatusMessage.className = 'status-message';
                }, 300);
            }, 3000);
        }
        
        // Test buttons
        document.getElementById('test-success').addEventListener('click', () => {
            showStatusMessage('Copied to clipboard!', 'success');
        });
        
        document.getElementById('test-error').addEventListener('click', () => {
            showStatusMessage('Copy failed. Please try again.', 'error');
        });
        
        document.getElementById('test-info').addEventListener('click', () => {
            showStatusMessage('Copying to clipboard...', 'info');
        });
        
        // Test actual clipboard functionality
        document.getElementById('test-clipboard').addEventListener('click', async () => {
            const text = document.getElementById('test-text').value;
            if (!text.trim()) {
                showStatusMessage('Please enter some text to copy.', 'error');
                return;
            }
            
            showStatusMessage('Copying to clipboard...', 'info');
            
            try {
                await navigator.clipboard.writeText(text);
                showStatusMessage('Text copied to clipboard!', 'success');
            } catch (err) {
                showStatusMessage('Copy failed. Please try again.', 'error');
                console.error('Copy failed:', err);
            }
        });
        
        console.log('Clipboard confirmation test page loaded');
    </script>
</body>
</html>
