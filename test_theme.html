<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .theme-preview {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .cyberpunk-theme {
            background-color: #0a0a12;
            color: #00f0ff;
            border: 1px solid #00f0ff;
        }
        .light-blue-theme {
            background-color: #f0f8ff;
            color: #333333;
            border: 1px solid #0077cc;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Theme Switching Test</h1>
        <p>This tests the theme switching functionality without Chrome extension APIs.</p>
        
        <div>
            <label>Select Theme:</label>
            <select id="theme-test-select">
                <option value="cyberpunk">Cyberpunk</option>
                <option value="light-blue">Light Blue</option>
            </select>
        </div>
        
        <div class="theme-preview cyberpunk-theme" id="theme-preview">
            <h3>Cyberpunk Theme Preview</h3>
            <p>This shows how the extension would look with the Cyberpunk theme.</p>
            <button style="border: 1px solid #00f0ff; color: #00f0ff;">EXPORT_SELECTED</button>
            <input type="text" placeholder="Filename" style="background-color: rgba(10, 10, 18, 0.7); color: #00ff8c; border: 1px solid #00f0ff;">
        </div>
        
        <div style="margin-top: 20px;">
            <h4>CSS Variables Check:</h4>
            <div id="css-vars"></div>
        </div>
    </div>

    <script>
        const themeSelect = document.getElementById('theme-test-select');
        const themePreview = document.getElementById('theme-preview');
        const cssVarsDiv = document.getElementById('css-vars');
        
        function updatePreview() {
            const theme = themeSelect.value;
            
            // Update preview box
            themePreview.className = 'theme-preview ' + (theme === 'light-blue' ? 'light-blue-theme' : 'cyberpunk-theme');
            themePreview.innerHTML = `
                <h3>${theme === 'light-blue' ? 'Light Blue' : 'Cyberpunk'} Theme Preview</h3>
                <p>This shows how the extension would look with the ${theme === 'light-blue' ? 'Light Blue' : 'Cyberpunk'} theme.</p>
                <button style="${theme === 'light-blue' ? 'background-color: #0077cc; color: white; border: 1px solid #aaddff;' : 'background-color: transparent; color: #00f0ff; border: 1px solid #00f0ff;'}">${theme === 'light-blue' ? 'EXPORT_SELECTED' : 'EXPORT_SELECTED'}</button>
                <input type="text" placeholder="Filename" style="${theme === 'light-blue' ? 'background-color: rgba(240, 248, 255, 0.9); color: #333333; border: 1px solid #aaddff;' : 'background-color: rgba(10, 10, 18, 0.7); color: #00ff8c; border: 1px solid #00f0ff;'}">
            `;
            
            // Show CSS variables
            const rootStyles = getComputedStyle(document.documentElement);
            const cyberpunkVars = `
                <strong>Cyberpunk Theme Variables:</strong><br>
                --neon-cyan: ${rootStyles.getPropertyValue('--neon-cyan').trim() || '#00f0ff'}<br>
                --neon-pink: ${rootStyles.getPropertyValue('--neon-pink').trim() || '#ff00a0'}<br>
                --dark-bg: ${rootStyles.getPropertyValue('--dark-bg').trim() || '#0a0a12'}<br>
            `;
            
            cssVarsDiv.innerHTML = cyberpunkVars;
        }
        
        themeSelect.addEventListener('change', updatePreview);
        updatePreview();
        
        // Test theme switching logic
        function applyTheme(theme) {
            document.body.classList.remove('theme-light-blue');
            if (theme === 'light-blue') {
                document.body.classList.add('theme-light-blue');
            }
            console.log('Theme applied:', theme);
        }
        
        // Simulate storage
        const savedTheme = localStorage.getItem('theme') || 'cyberpunk';
        themeSelect.value = savedTheme;
        applyTheme(savedTheme);
        
        themeSelect.addEventListener('change', () => {
            applyTheme(themeSelect.value);
            localStorage.setItem('theme', themeSelect.value);
        });
    </script>
</body>
</html>
